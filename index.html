<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayya Studio Management</title>
    
    <!-- Memuat Tailwind CSS untuk desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat React dan ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Memuat Babel untuk menerjemahkan kode React JSX di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Style tambahan untuk animasi -->
    <style>
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, deleteDoc, onSnapshot, collection, addDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Menyimpan modul Firebase ke global window agar bisa diakses oleh React (Babel)
        window.FirebaseLib = { 
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, 
            getFirestore, doc, deleteDoc, onSnapshot, collection, addDoc, updateDoc, setDoc 
        };
    </script>

    <script type="text/babel">
        // Menunggu sampai modul Firebase selesai dimuat di browser
        const checkFirebase = setInterval(() => {
            if (window.FirebaseLib) {
                clearInterval(checkFirebase);
                startApp();
            }
        }, 100);

        function startApp() {
            const { useState, useEffect } = React;
            const { 
                initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, 
                getFirestore, doc, deleteDoc, onSnapshot, collection, addDoc, updateDoc, setDoc 
            } = window.FirebaseLib;

            // --- KONFIGURASI FIREBASE CLOUD ---
            let firebaseConfig;
            let appId;
            
            // Logika deteksi lingkungan (Platform ini vs GitHub)
            if (typeof __firebase_config !== 'undefined') {
                // Jika berjalan di platform pratinjau ini
                firebaseConfig = JSON.parse(__firebase_config);
                appId = typeof __app_id !== 'undefined' ? __app_id : 'rayya-studio';
            } else {
                // ========================================================
                // JIKA DIUPLOAD KE GITHUB PENGATURAN INI YANG AKAN DIPAKAI
                // Ganti konfigurasi di bawah ini dengan milik Anda sendiri
                // (Dapatkan dari Google Firebase Console -> Project Settings)
                // ========================================================
                firebaseConfig = {
                    apiKey: "AIzaSyDfQqpAqFDXpgq45m5aUIcr1Y-IAp_B1Lo",
  authDomain: "reservasi-rayya.firebaseapp.com",
  projectId: "reservasi-rayya",
  storageBucket: "reservasi-rayya.firebasestorage.app",
  messagingSenderId: "292552738627",
  appId: "1:292552738627:web:2fd40cb1bf5222390251f6",
                };
                appId = "rayya-studio-production";
            }

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // Helper untuk mendapatkan tanggal lokal
            const getTodayLocal = () => {
                const d = new Date();
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().split('T')[0];
            };

            function App() {
                const [activeTab, setActiveTab] = useState('dashboard');
                const [user, setUser] = useState(null);
                
                const [reservasiList, setReservasiList] = useState([]);
                const [keuanganList, setKeuanganList] = useState([]);
                
                // Konfigurasi Paket
                const paketOptions = [
                    { name: 'Express (10 Menit)', price: 30000 },
                    { name: 'Basic (20 Menit)', price: 50000 },
                    { name: 'Standart (25 Menit)', price: 75000 },
                    { name: 'Superior (40 Menit)', price: 150000 },
                    { name: 'Custom (Manual)', price: 0 }
                ];

                // Konfigurasi Add-ons
                const addOnsOptions = [
                    { id: 'time', name: 'Time (5 Minutes)', price: 10000 },
                    { id: 'person', name: 'Person', price: 25000 },
                    { id: 'costumDino', name: 'Costum Dino', price: 5000 },
                    { id: 'print4rBasic', name: 'Print 4r (Basic)', price: 5000 },
                    { id: 'print4rGrid', name: 'Print 4r (Grid)', price: 7000 },
                    { id: 'printStrip', name: 'Print (2) Strip', price: 8000 },
                    { id: 'printA4', name: 'Print A4', price: 15000 },
                    { id: 'keychain1', name: 'Keychain (Ganci)', price: 10000 },
                    { id: 'keychain2', name: 'Keychain (2 Sisi)', price: 15000 },
                    { id: 'ganciKarakter', name: 'Ganci Karakter', price: 10000 },
                    { id: 'pigura4r', name: 'Pigura 4r', price: 15000 },
                    { id: 'piguraA4', name: 'Pigura A4 (10R)', price: 30000 },
                ];

                const [resForm, setResForm] = useState({
                    nama: '', tanggal: '', jam: '', paket: 'Basic (20 Menit)', 
                    customPrice: '', addOns: {}, status: 'Belum Lunas'
                });

                const [notification, setNotification] = useState(null);
                const [filterTanggal, setFilterTanggal] = useState(getTodayLocal());
                const [filterKeuMulai, setFilterKeuMulai] = useState('');
                const [filterKeuSelesai, setFilterKeuSelesai] = useState('');
                
                const [keuForm, setKeuForm] = useState({
                    tipe: 'Pemasukan', tanggal: '', kategori: 'Sesi Foto', nominal: '', keterangan: ''
                });

                const [editingResId, setEditingResId] = useState(null);
                const [editingKeuId, setEditingKeuId] = useState(null);

                const formatRupiah = (angka) => {
                    return new Intl.NumberFormat('id-ID', {
                        style: 'currency', currency: 'IDR',
                        minimumFractionDigits: 0, maximumFractionDigits: 0
                    }).format(angka || 0);
                };

                const hitungDurasi = (paket, addOns) => {
                    let base = 30; 
                    if (paket.includes('10 Menit')) base = 10;
                    else if (paket.includes('20 Menit')) base = 20;
                    else if (paket.includes('25 Menit')) base = 25;
                    else if (paket.includes('40 Menit')) base = 40;
                    
                    let extra = (addOns && addOns.time) ? parseInt(addOns.time) * 5 : 0;
                    return base + extra;
                };

                const hitungJamSelesai = (jamAwal, durasiMenit) => {
                    if (!jamAwal) return '';
                    const [h, m] = jamAwal.split(':').map(Number);
                    const date = new Date();
                    date.setHours(h, m + durasiMenit, 0);
                    return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                };

                const hitungTotalHarga = () => {
                    let total = 0;
                    if (resForm.paket === 'Custom (Manual)') {
                        total += Number(resForm.customPrice) || 0;
                    } else {
                        const selectedPaket = paketOptions.find(p => p.name === resForm.paket);
                        if (selectedPaket) total += selectedPaket.price;
                    }
                    Object.entries(resForm.addOns).forEach(([id, qty]) => {
                        if (qty > 0) {
                            const addon = addOnsOptions.find(a => a.id === id);
                            if (addon) total += (addon.price * qty);
                        }
                    });
                    return total;
                };

                const handleAddOnChange = (id, value) => {
                    const qty = Math.max(0, parseInt(value) || 0);
                    setResForm(prev => ({ ...prev, addOns: { ...prev.addOns, [id]: qty } }));
                };

                useEffect(() => {
                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (error) {
                            console.error("Auth error:", error);
                        }
                    };
                    initAuth();
                    const unsubscribe = onAuthStateChanged(auth, setUser);
                    return () => unsubscribe();
                }, []);

                // Fetch Data Reservasi (Menggunakan jalur PUBLIC agar bisa diakses semua perangkat kasir/admin)
                useEffect(() => {
                    if (!user) return;
                    const resRef = collection(db, 'artifacts', appId, 'public', 'data', 'reservasi');
                    const unsub = onSnapshot(resRef, (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        data.sort((a, b) => a.createdAt - b.createdAt);
                        setReservasiList(data);
                    }, (err) => console.error(err));
                    return () => unsub();
                }, [user]);

                // Fetch Data Keuangan (Menggunakan jalur PUBLIC)
                useEffect(() => {
                    if (!user) return;
                    const keuRef = collection(db, 'artifacts', appId, 'public', 'data', 'keuangan');
                    const unsub = onSnapshot(keuRef, (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        data.sort((a, b) => a.createdAt - b.createdAt);
                        setKeuanganList(data);
                    }, (err) => console.error(err));
                    return () => unsub();
                }, [user]);

                const showNotification = (message) => {
                    setNotification(message);
                    setTimeout(() => setNotification(null), 3000);
                };

                const handleReservasiSubmit = async (e) => {
                    e.preventDefault();
                    if (!user) return showNotification("Gagal: Menunggu koneksi cloud...");
                    if (!resForm.nama || !resForm.tanggal || !resForm.jam) {
                        return showNotification("Harap isi nama, tanggal, dan jam reservasi!");
                    }
                    
                    const totalHarga = hitungTotalHarga();
                    try {
                        if (editingResId) {
                            const resRef = doc(db, 'artifacts', appId, 'public', 'data', 'reservasi', editingResId);
                            await updateDoc(resRef, { ...resForm, totalHarga: totalHarga });
                            setEditingResId(null);
                            showNotification("☁️ Reservasi berhasil diperbarui!");
                        } else {
                            const resRef = collection(db, 'artifacts', appId, 'public', 'data', 'reservasi');
                            await addDoc(resRef, { ...resForm, totalHarga: totalHarga, createdAt: Date.now() });
                            showNotification("☁️ Reservasi tersimpan di Cloud!");
                        }
                        setResForm({ 
                            nama: '', tanggal: '', jam: '', paket: 'Basic (20 Menit)', 
                            customPrice: '', addOns: {}, status: 'Belum Lunas' 
                        });
                    } catch (error) {
                        showNotification("❌ Gagal menyimpan data.");
                        console.error(error);
                    }
                };

                const handleKeuanganSubmit = async (e) => {
                    e.preventDefault();
                    if (!user) return showNotification("Gagal: Menunggu koneksi cloud...");
                    if (!keuForm.tanggal || !keuForm.nominal || keuForm.nominal <= 0) return;
                    
                    try {
                        if (editingKeuId) {
                            const keuRef = doc(db, 'artifacts', appId, 'public', 'data', 'keuangan', editingKeuId);
                            await updateDoc(keuRef, { ...keuForm, nominal: Number(keuForm.nominal) });
                            setEditingKeuId(null);
                            showNotification("☁️ Transaksi berhasil diperbarui!");
                        } else {
                            const keuRef = collection(db, 'artifacts', appId, 'public', 'data', 'keuangan');
                            await addDoc(keuRef, { ...keuForm, nominal: Number(keuForm.nominal), createdAt: Date.now() });
                            showNotification("☁️ Transaksi tersimpan di Cloud!");
                        }
                        setKeuForm(prev => ({ ...prev, nominal: '', keterangan: '' }));
                    } catch (error) {
                        showNotification("❌ Gagal menyimpan transaksi.");
                    }
                };

                const handleCatatKeKeuangan = async (item) => {
                    if (!user) return showNotification("Gagal: Menunggu koneksi cloud...");
                    try {
                        const keuDocId = `res_${item.id}`;
                        const keuRef = doc(db, 'artifacts', appId, 'public', 'data', 'keuangan', keuDocId);
                        await setDoc(keuRef, {
                            tipe: 'Pemasukan', tanggal: item.tanggal, kategori: 'Sesi Foto',
                            nominal: item.totalHarga, keterangan: `Reservasi: ${item.nama} (${item.paket})`,
                            createdAt: item.createdAt || Date.now() 
                        }, { merge: true });

                        if (item.status !== 'Lunas') {
                            const resRef = doc(db, 'artifacts', appId, 'public', 'data', 'reservasi', item.id);
                            await updateDoc(resRef, { status: 'Lunas' });
                        }
                        showNotification("✅ Data tersinkronisasi dengan Keuangan!");
                    } catch (error) {
                        showNotification("❌ Gagal mencatat ke keuangan.");
                    }
                };

                const batalkanEditRes = () => {
                    setEditingResId(null);
                    setResForm({ nama: '', tanggal: '', jam: '', paket: 'Basic (20 Menit)', customPrice: '', addOns: {}, status: 'Belum Lunas' });
                };

                const batalkanEditKeu = () => {
                    setEditingKeuId(null);
                    setKeuForm(prev => ({ ...prev, nominal: '', keterangan: '' }));
                };

                const totalPemasukan = keuanganList.filter(i => i.tipe === 'Pemasukan').reduce((s, i) => s + Number(i.nominal), 0);
                const totalPengeluaran = keuanganList.filter(i => i.tipe === 'Pengeluaran').reduce((s, i) => s + Number(i.nominal), 0);
                const labaBersih = totalPemasukan - totalPengeluaran;

                const kategPemasukan = ["Sesi Foto", "Cetak Tambahan", "Softcopy Tambahan", "Lain-lain"];
                const kategPengeluaran = ["Sewa Tempat", "Listrik & Internet", "Kertas Foto", "Peralatan/Props", "Gaji", "Lain-lain"];
                const activeKategori = keuForm.tipe === 'Pemasukan' ? kategPemasukan : kategPengeluaran;

                const filteredReservasiList = reservasiList
                    .filter(item => filterTanggal === '' || item.tanggal === filterTanggal)
                    .sort((a, b) => {
                        if (a.tanggal !== b.tanggal) return new Date(a.tanggal) - new Date(b.tanggal);
                        return (a.jam || '').localeCompare(b.jam || '');
                    });

                const filteredKeuanganList = keuanganList.filter(item => {
                    if (filterKeuMulai && item.tanggal < filterKeuMulai) return false;
                    if (filterKeuSelesai && item.tanggal > filterKeuSelesai) return false;
                    return true;
                }).sort((a, b) => {
                    if (a.tanggal !== b.tanggal) return new Date(b.tanggal) - new Date(a.tanggal); 
                    return (b.createdAt || 0) - (a.createdAt || 0);
                });

                useEffect(() => { setKeuForm(prev => ({ ...prev, kategori: activeKategori[0] })); }, [keuForm.tipe]);

                const handleExportLaporan = () => {
                    if (filteredKeuanganList.length === 0) return showNotification("❌ Tidak ada data untuk diexport.");
                    const headers = ["Tanggal", "Tipe", "Kategori", "Nominal", "Keterangan"];
                    let totalMasuk = 0; let totalKeluar = 0;
                    const rows = filteredKeuanganList.map(item => {
                        if (item.tipe === 'Pemasukan') totalMasuk += Number(item.nominal);
                        if (item.tipe === 'Pengeluaran') totalKeluar += Number(item.nominal);
                        return [item.tanggal, item.tipe, item.kategori, item.nominal, `"${(item.keterangan || '').replace(/"/g, '""')}"`].join(",");
                    });
                    rows.push(""); rows.push(`"","","TOTAL PEMASUKAN",${totalMasuk},""`);
                    rows.push(`"","","TOTAL PENGELUARAN",${totalKeluar},""`); rows.push(`"","","LABA BERSIH",${totalMasuk - totalKeluar},""`);
                    const csvContent = headers.join(",") + "\n" + rows.join("\n");
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.setAttribute("href", URL.createObjectURL(blob));
                    link.setAttribute("download", `Laporan_Keuangan_Rayya.csv`);
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    showNotification("✅ Laporan berhasil diexport!");
                };

                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row font-sans">
                        {notification && (
                            <div className="fixed top-4 right-4 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg z-50 animate-bounce">
                                {notification}
                            </div>
                        )}

                        <aside className="w-full md:w-64 bg-white border-r border-gray-200 md:min-h-screen p-5 flex flex-col shadow-sm z-10">
                            <div className="flex items-center gap-3 mb-8">
                                <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white text-xl shadow-md">📸</div>
                                <h1 className="text-xl font-bold text-gray-800 leading-tight">Rayya<br/><span className="text-sm font-medium text-gray-500">Self Photo Studio</span></h1>
                            </div>
                            <nav className="flex md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-2 md:pb-0">
                                <button onClick={() => setActiveTab('dashboard')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-700 font-semibold border-l-4 border-blue-600' : 'text-gray-600 hover:bg-gray-100'}`}>📊 <span className="hidden md:inline">Dashboard Rekap</span><span className="md:hidden">Dashboard</span></button>
                                <button onClick={() => setActiveTab('reservasi')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors whitespace-nowrap ${activeTab === 'reservasi' ? 'bg-blue-50 text-blue-700 font-semibold border-l-4 border-blue-600' : 'text-gray-600 hover:bg-gray-100'}`}>📅 <span className="hidden md:inline">Manajemen Reservasi</span><span className="md:hidden">Reservasi</span></button>
                                <button onClick={() => setActiveTab('keuangan')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors whitespace-nowrap ${activeTab === 'keuangan' ? 'bg-blue-50 text-blue-700 font-semibold border-l-4 border-blue-600' : 'text-gray-600 hover:bg-gray-100'}`}>💰 <span className="hidden md:inline">Transaksi Keuangan</span><span className="md:hidden">Keuangan</span></button>
                            </nav>
                        </aside>

                        <main className="flex-1 p-5 md:p-8 overflow-y-auto max-w-5xl mx-auto w-full">
                            {/* HALAMAN DASHBOARD */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6 animate-fade-in">
                                    <h2 className="text-2xl font-bold text-gray-800 border-b pb-2">📊 Dashboard Rekap</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="bg-green-50 border border-green-200 p-5 rounded-xl"><p className="text-green-600 font-semibold text-sm">Total Pemasukan</p><p className="text-2xl font-bold text-green-700 mt-1">{formatRupiah(totalPemasukan)}</p></div>
                                        <div className="bg-red-50 border border-red-200 p-5 rounded-xl"><p className="text-red-600 font-semibold text-sm">Total Pengeluaran</p><p className="text-2xl font-bold text-red-700 mt-1">{formatRupiah(totalPengeluaran)}</p></div>
                                        <div className="bg-blue-50 border border-blue-200 p-5 rounded-xl"><p className="text-blue-600 font-semibold text-sm">Laba Bersih</p><p className="text-2xl font-bold text-blue-700 mt-1">{formatRupiah(labaBersih)}</p></div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                                        <h3 className="text-lg font-semibold text-gray-700 mb-4">Transaksi Terakhir</h3>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead><tr className="bg-gray-50 text-gray-600 text-sm border-b"><th className="p-3 font-semibold">Tanggal</th><th className="p-3 font-semibold">Tipe</th><th className="p-3 font-semibold">Kategori</th><th className="p-3 font-semibold">Nominal</th></tr></thead>
                                                <tbody>
                                                    {keuanganList.slice(-5).reverse().map((item) => (
                                                        <tr key={item.id} className="border-b hover:bg-gray-50">
                                                            <td className="p-3 text-sm text-gray-700">{item.tanggal}</td>
                                                            <td className="p-3 text-sm"><span className={`px-2 py-1 rounded-full text-xs font-medium ${item.tipe === 'Pemasukan' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{item.tipe}</span></td>
                                                            <td className="p-3 text-sm text-gray-700">{item.kategori}</td>
                                                            <td className="p-3 text-sm font-medium text-gray-800">{formatRupiah(item.nominal)}</td>
                                                        </tr>
                                                    ))}
                                                    {keuanganList.length === 0 && <tr><td colSpan="4" className="p-4 text-center text-gray-500 italic">Belum ada data transaksi.</td></tr>}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* HALAMAN RESERVASI */}
                            {activeTab === 'reservasi' && (
                                <div className="space-y-6 animate-fade-in">
                                    <h2 className="text-2xl font-bold text-gray-800 border-b pb-2">📅 Manajemen Reservasi</h2>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                                        <h3 className="text-lg font-semibold text-gray-700 mb-4">{editingResId ? '✏️ Edit Data Reservasi' : 'Buat Reservasi Baru'}</h3>
                                        <form onSubmit={handleReservasiSubmit} className="space-y-4">
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Nama Pelanggan *</label><input type="text" value={resForm.nama} onChange={e => setResForm({...resForm, nama: e.target.value})} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required /></div>
                                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Tanggal *</label><input type="date" value={resForm.tanggal} onChange={e => setResForm({...resForm, tanggal: e.target.value})} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required /></div>
                                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Jam Sesi *</label><input type="time" value={resForm.jam} onChange={e => setResForm({...resForm, jam: e.target.value})} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required /></div>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Pilihan Paket</label>
                                                    <select value={resForm.paket} onChange={e => setResForm({...resForm, paket: e.target.value})} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                                        {paketOptions.map(p => <option key={p.name} value={p.name}>{p.name} {p.price > 0 ? ` - Rp ${p.price.toLocaleString('id-ID')}` : ''}</option>)}
                                                    </select>
                                                </div>
                                                {resForm.paket === 'Custom (Manual)' && (
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Harga Manual</label><input type="number" value={resForm.customPrice} onChange={e => setResForm({...resForm, customPrice: e.target.value})} className="w-full p-2 border rounded-lg outline-none bg-blue-50" required /></div>
                                                )}
                                            </div>
                                            <div className="bg-gray-50 p-4 rounded-lg mt-4 border">
                                                <h4 className="text-sm font-bold text-gray-700 mb-3">Add-Ons (Isi jumlah)</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                                    {addOnsOptions.map(addon => (
                                                        <div key={addon.id} className="flex items-center justify-between bg-white p-2 rounded border">
                                                            <div className="flex flex-col"><span className="text-xs font-medium text-gray-800">{addon.name}</span><span className="text-[10px] text-gray-500">Rp {addon.price.toLocaleString('id-ID')}</span></div>
                                                            <input type="number" min="0" value={resForm.addOns[addon.id] || ''} onChange={(e) => handleAddOnChange(addon.id, e.target.value)} className="w-16 p-1 text-center text-sm border rounded outline-none" placeholder="0" />
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex flex-col md:flex-row justify-between items-center bg-blue-50 p-4 rounded-lg border">
                                                <div className="w-full md:w-1/3 mb-4 md:mb-0"><label className="block text-sm font-bold text-gray-700 mb-1">Status</label><select value={resForm.status} onChange={e => setResForm({...resForm, status: e.target.value})} className="w-full p-2 border rounded-lg"><option>Belum Lunas</option><option>DP</option><option>Lunas</option></select></div>
                                                <div className="text-right"><p className="text-sm text-gray-600 font-medium mb-1">Total Estimasi Tagihan</p><p className="text-3xl font-bold text-blue-700">{formatRupiah(hitungTotalHarga())}</p></div>
                                            </div>
                                            <div className="flex justify-end mt-4 gap-2">
                                                {editingResId && <button type="button" onClick={batalkanEditRes} className="bg-gray-300 py-3 px-6 rounded-lg">Batal</button>}
                                                <button type="submit" className="bg-blue-600 text-white py-3 px-8 rounded-lg">💾 {editingResId ? 'Simpan' : 'Simpan'}</button>
                                            </div>
                                        </form>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                                        <div className="flex justify-between mb-4"><h3 className="text-lg font-semibold text-gray-700">📋 Jadwal Sesi</h3>
                                        <input type="date" value={filterTanggal} onChange={e => setFilterTanggal(e.target.value)} className="p-1 border rounded text-sm"/></div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead><tr className="bg-gray-50 border-b"><th className="p-3">Waktu</th><th className="p-3">Nama</th><th className="p-3">Paket</th><th className="p-3">Status</th><th className="p-3">Aksi</th></tr></thead>
                                                <tbody>
                                                    {filteredReservasiList.map((item) => (
                                                        <tr key={item.id} className="border-b hover:bg-gray-50">
                                                            <td className="p-3"><div className="font-bold">{item.jam}</div><div className="text-xs text-gray-500">s/d {hitungJamSelesai(item.jam, hitungDurasi(item.paket, item.addOns))}</div></td>
                                                            <td className="p-3 font-bold">{item.nama}</td>
                                                            <td className="p-3 text-sm"><span className="text-blue-600">{item.paket}</span></td>
                                                            <td className="p-3 font-bold">{formatRupiah(item.totalHarga)}<br/><span className="text-[10px] uppercase text-green-700 bg-green-100 px-2 rounded-full">{item.status}</span></td>
                                                            <td className="p-3 text-sm">
                                                                <button onClick={() => {setEditingResId(item.id); setResForm({nama: item.nama, tanggal: item.tanggal, jam: item.jam, paket: item.paket, customPrice: item.customPrice || '', addOns: item.addOns || {}, status: item.status || 'Belum Lunas'}); window.scrollTo(0,0);}} className="text-blue-500 mr-2">Edit</button>
                                                                <button onClick={() => handleCatatKeKeuangan(item)} className="text-green-500 mr-2">Sinkron Uang</button>
                                                                <button onClick={async () => { if(user) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reservasi', item.id)); }} className="text-red-500">Hapus</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* HALAMAN KEUANGAN */}
                            {activeTab === 'keuangan' && (
                                <div className="space-y-6 animate-fade-in">
                                    <h2 className="text-2xl font-bold text-gray-800 border-b pb-2">💰 Transaksi Keuangan</h2>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                                        <h3 className="text-lg font-semibold text-gray-700 mb-4">{editingKeuId ? '✏️ Edit Transaksi' : 'Catat Pemasukan / Pengeluaran'}</h3>
                                        <form onSubmit={handleKeuanganSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="md:col-span-2 flex gap-4"><label><input type="radio" checked={keuForm.tipe==='Pemasukan'} onChange={()=>setKeuForm({...keuForm, tipe:'Pemasukan'})}/> Pemasukan</label><label><input type="radio" checked={keuForm.tipe==='Pengeluaran'} onChange={()=>setKeuForm({...keuForm, tipe:'Pengeluaran'})}/> Pengeluaran</label></div>
                                            <div><label className="block text-sm">Tanggal</label><input type="date" value={keuForm.tanggal} onChange={e=>setKeuForm({...keuForm, tanggal:e.target.value})} className="w-full p-2 border rounded" /></div>
                                            <div><label className="block text-sm">Kategori</label><select value={keuForm.kategori} onChange={e=>setKeuForm({...keuForm, kategori:e.target.value})} className="w-full p-2 border rounded">{activeKategori.map(k=><option key={k}>{k}</option>)}</select></div>
                                            <div><label className="block text-sm">Nominal (Rp)</label><input type="number" value={keuForm.nominal} onChange={e=>setKeuForm({...keuForm, nominal:e.target.value})} className="w-full p-2 border rounded" /></div>
                                            <div><label className="block text-sm">Keterangan</label><input type="text" value={keuForm.keterangan} onChange={e=>setKeuForm({...keuForm, keterangan:e.target.value})} className="w-full p-2 border rounded" /></div>
                                            <div className="md:col-span-2 flex justify-end gap-2"><button type="submit" className="bg-blue-600 text-white py-2 px-6 rounded">Simpan</button></div>
                                        </form>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                                        <div className="flex justify-between items-center mb-4"><h3 className="text-lg font-semibold">Riwayat</h3> <button onClick={handleExportLaporan} className="bg-green-600 text-white px-4 py-1.5 rounded text-sm">📥 Export CSV</button></div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead><tr className="bg-gray-50 border-b"><th className="p-3">Tanggal</th><th className="p-3">Tipe</th><th className="p-3">Keterangan</th><th className="p-3">Nominal</th><th className="p-3">Aksi</th></tr></thead>
                                                <tbody>
                                                    {filteredKeuanganList.map((item) => (
                                                        <tr key={item.id} className="border-b hover:bg-gray-50">
                                                            <td className="p-3 text-sm">{item.tanggal}</td>
                                                            <td className="p-3 text-sm"><span className={`px-2 py-1 rounded-full text-xs ${item.tipe === 'Pemasukan' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{item.tipe}</span></td>
                                                            <td className="p-3 text-sm text-gray-500">{item.keterangan || '-'}</td>
                                                            <td className="p-3 text-sm font-medium">{formatRupiah(item.nominal)}</td>
                                                            <td className="p-3 text-sm text-center">
                                                                <button onClick={() => {setEditingKeuId(item.id); setKeuForm({tipe: item.tipe, tanggal: item.tanggal, kategori: item.kategori, nominal: item.nominal, keterangan: item.keterangan || ''}); window.scrollTo(0,0);}} className="text-blue-500 mr-2">Edit</button>
                                                                <button onClick={async () => { if(user) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'keuangan', item.id)); }} className="text-red-500">Hapus</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        }
    </script>
</body>
</html>
